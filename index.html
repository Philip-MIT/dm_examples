      {

          {

          },
          {
            file: "example_evals/eval_actuator_unboxing_pi05_sweep_v2_01_freeze_01_full_episode_000025_dm_unbox_actuator_1004_test1s_checkpoint-1300_ds10_v2.mp4",

          }
        ]
      },
      {
        title: "Examples of finding sub-optimal timesteps to potentially filter out of training data\n(source dataset: actuator_unboxing_10h_vr)",
        videos: [
          {
            file: "example_data_cleaning/episode_000221_dm_unbox_actuator_1004_test1s_checkpoint-500_ds30_v2.mp4",

          {

            subtitle: "Episode 000976 (correlation between progress values and timestep: 0.95)"
          }
        ]
      }
    ];



    const container = document.getElementById("video-container");
    videoSections.forEach(section => {
      const heading = document.createElement("h2");
      heading.className = "section-heading";
      heading.textContent = section.title;
      container.appendChild(heading);

      section.videos.forEach(item => {
        const block = document.createElement("div");
        block.className = "video-block";

        const desc = document.createElement("p");
        desc.className = "description";
        desc.textContent = item.subtitle;

        const video = document.createElement("video");
        video.setAttribute("controls", "");
        video.setAttribute("controlslist", "");
        video.preload = "metadata";
        video.disablePictureInPicture = true;
        video.playsInline = true;
        video.defaultPlaybackRate = 2.0;
        video.playbackRate = 2.0;
        video.addEventListener("loadedmetadata", () => {
          // video.defaultPlaybackRate = 2.0;
          // video.playbackRate = 2.0;
          video.defaultPlaybackRate = 1.0;
          video.playbackRate = 1.0;
        }, { once: true });
        video.setAttribute("aria-label", item.subtitle);

        const source = document.createElement("source");
        source.src = item.file;
        source.type = "video/mp4";
        video.appendChild(source);
        video.appendChild(document.createTextNode("Your browser does not support HTML5 video."));

        block.appendChild(desc);
        block.appendChild(video);
        container.appendChild(block);
      });
    });
  </script>
